[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-thermal-measurement"
version = "0.1.0"
description = "SDK-free radiometry measurement for DJI R-JPEG thermal images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
]

[project.scripts]
dji-thermal-measure = "thermal_measurement.radiometry:main"

[tool.setuptools.package-data]
thermal_measurement = ["data/*.json"]
